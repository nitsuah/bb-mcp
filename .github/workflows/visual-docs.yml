name: Visual docs

# bb-mcp has no web UI, so its "screenshots" are generated from the real tool
# manifest and RBAC policy (scripts/visual-docs.mjs), and its diagrams are
# rendered from docs/diagrams/*.mmd. Output is committed by a bot PR.

on:
  push:
    branches: [main]
    paths:
      - "src/tools/**"
      - "src/manifest.ts"
      - "src/rbac.ts"
      - "src/schemas.ts"
      - "scripts/visual-docs.mjs"
      - "docs/diagrams/*.mmd"
      - "docs/diagrams/mermaid.config.json"
      - ".github/workflows/visual-docs.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  visual-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
          npm install --no-save @resvg/resvg-js@2.6.2

      - name: Install monospace font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Generate screenshots (SVG and PNG from the tool manifest)
        run: node scripts/visual-docs.mjs

      - name: Render Mermaid diagrams
        run: |
          for f in docs/diagrams/*.mmd; do
            docker run --rm -v "$PWD/docs/diagrams:/data" \
              minlag/mermaid-cli@sha256:99c983b3ab4e14033f2880bc1b9de17e5090b4515dabd63fe9cf8c0ae6130956 \
              -c /data/mermaid.config.json -i "/data/$(basename "$f")" -o "/data/$(basename "${f%.mmd}.svg")"
            sudo chown "$USER" "${f%.mmd}.svg"
            echo >> "${f%.mmd}.svg"
          done

      - name: Open PR with regenerated visuals
        uses: peter-evans/create-pull-request@v8
        with:
          branch: bot/visual-docs
          commit-message: "docs: regenerate screenshots and diagrams"
          title: "docs: regenerate screenshots and diagrams"
          body: |
            Regenerated by `.github/workflows/visual-docs.yml` from the tool manifest, RBAC policy and `docs/diagrams/*.mmd`.
          add-paths: |
            docs/screenshots/**
            docs/diagrams/*.svg
