name: Journeys

# Nightly "AI user" journeys (tests/journeys). Failures become deduplicated
# `bot:journey` issues with no AI involved. Contract:
# https://github.com/nitsuah/.github/blob/main/journeys/STANDARD.md
#
# Both refs below are the nitsuah/.github main commit this was written against
# (`git ls-remote https://github.com/nitsuah/.github main`). The workflow ref and
# kit-ref must stay the same commit; bump them together.

on:
  schedule:
    - cron: "41 7 * * *" # pick a minute that doesn't collide with other nightlies
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "tests/journeys/**"
      - "config/playwright.journeys.config.mjs"
      - "src/**"
      - "docs/brag/**"
      - "package-lock.json"
      - ".github/workflows/journeys.yml"

permissions: {}

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pull requests run repo code (npm ci, the journeys) and the shared workflow
  # only prints a summary there, so they get a read-only token.
  journeys-pr:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      issues: read
    uses: nitsuah/.github/.github/workflows/journeys.yml@03aa622645df326946d42abf3c4ab7919b044495
    with:
      # Keep in step with @playwright/test in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      command: npm run test:journeys
      features: promo/spots.json
      kit-ref: 03aa622645df326946d42abf3c4ab7919b044495
      repro: |
        docker run --rm -v "$PWD:/w" -w /w -e CI=true mcr.microsoft.com/playwright:v1.64.1-jammy \
          sh -c "npm ci && npm run test:journeys"

  # Nightly and manual runs file and close bot:journey issues and update the
  # bot/journeys branch (BUGS.md, metrics, failure screenshots).
  journeys:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write # bot/journeys branch only
      issues: write
    uses: nitsuah/.github/.github/workflows/journeys.yml@03aa622645df326946d42abf3c4ab7919b044495
    with:
      image: mcr.microsoft.com/playwright:v1.64.1-jammy
      command: npm run test:journeys
      features: promo/spots.json
      kit-ref: 03aa622645df326946d42abf3c4ab7919b044495
      repro: |
        docker run --rm -v "$PWD:/w" -w /w -e CI=true mcr.microsoft.com/playwright:v1.64.1-jammy \
          sh -c "npm ci && npm run test:journeys"
